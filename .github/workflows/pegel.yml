# Zentrale Datensammlung (PEGELONLINE der WSV, Vorhersage des WSA Weser): ein Abruf je Quelle, alle Verbraucher lesen die Ergebnisse
# von hier. Läuft zweimal täglich, jeweils kurz VOR dem Prognose-Lauf (meinrved-prognose, 06:15 und 11:45 UTC), damit dieser frische
# Werte aus live.json nehmen kann. GitHub startet geplante Läufe oft Stunden zu spät oder lässt sie aus; deshalb gibt es zusätzliche
# Zwischentermine (03, 09, 15 UTC). Weil jeder Lauf 31 Tage zurückgreift, kann ein Lauf ausfallen, ohne dass Lücken entstehen.
# Das Veröffentlichen auf Pages wird bis zu dreimal versucht (Infrastrukturfehler am 14. und 21.11.2026); die Wache (wache.yml)
# meldet per Fehlermail, wenn die veröffentlichten Daten zu alt werden.
name: Pegelarchiv
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '30 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pegel
  cancel-in-progress: false
jobs:
  archivieren:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://syring-digital.github.io/meinrved-pegel/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python pegel.py update
      - run: python pegel.py wsa
        continue-on-error: true      # ein Ausfall des WSA-PDF darf die Pegelwerte nicht aufhalten
      - run: python pegel.py build
      - run: python pegel.py live
      - name: Daten ins Repository
        run: |
          git config user.name "Pegelarchiv"
          git config user.email "actions@github.com"
          git add daten
          git diff --cached --quiet || (git commit -q -m "Pegelwerte $(date -u +%Y-%m-%d_%H%M)" && git push -q)
      - run: cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Warten vor 2. Versuch
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Warten vor 3. Versuch
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Veröffentlichen endgültig gescheitert
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "::error::Pages-Veröffentlichung nach drei Versuchen gescheitert. Die Daten sind im Repository gesichert."
          exit 1
