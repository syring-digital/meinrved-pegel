# Zentrale Datensammlung (PEGELONLINE der WSV, Vorhersage des WSA Weser): ein Abruf je Quelle, alle Verbraucher lesen die Ergebnisse
# von hier. Läuft zweimal täglich, jeweils kurz VOR dem Prognose-Lauf (meinrved-prognose, 06:15 und 11:45 UTC), damit dieser frische
# Werte aus live.json nehmen kann. Weil jeder Lauf 31 Tage zurückgreift, kann ein Lauf ausfallen, ohne dass Lücken entstehen.
name: Pegelarchiv
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pegel
  cancel-in-progress: false
jobs:
  archivieren:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python pegel.py update
      - run: python pegel.py wsa
        continue-on-error: true      # ein Ausfall des WSA-PDF darf die Pegelwerte nicht aufhalten
      - run: python pegel.py build
      - run: python pegel.py live
      - name: Daten ins Repository
        run: |
          git config user.name "Pegelarchiv"
          git config user.email "actions@github.com"
          git add daten
          git diff --cached --quiet || (git commit -q -m "Pegelwerte $(date -u +%Y-%m-%d_%H%M)" && git push -q)
      - run: cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
